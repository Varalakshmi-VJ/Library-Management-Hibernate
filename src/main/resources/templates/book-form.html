<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Book')}"></head>
<body>
<nav th:replace="~{fragments :: nav(${active})}"></nav>
<div class="container" style="max-width:640px">
  <h3 th:text="${form.id == null} ? 'Add Book' : 'Edit Book'"></h3>
  <form method="post" action="/books/save" th:object="${form}" class="card card-body">
    <input type="hidden" th:field="*{id}">
    <div class="mb-3"><label class="form-label">Title</label>
      <input class="form-control" th:field="*{title}" th:errorclass="is-invalid">
      <div class="invalid-feedback" th:errors="*{title}"></div></div>
    <div class="mb-3"><label class="form-label">Authors (comma separated)</label>
      <input class="form-control" th:field="*{authorNames}" th:errorclass="is-invalid" placeholder="Gavin King, Christian Bauer">
      <div class="invalid-feedback" th:errors="*{authorNames}"></div></div>
    <div class="mb-3"><label class="form-label">ISBN</label>
      <input class="form-control" th:field="*{isbn}" th:errorclass="is-invalid">
      <div class="invalid-feedback" th:errors="*{isbn}"></div></div>
    <div class="mb-3"><label class="form-label">Category</label>
      <input class="form-control" th:field="*{category}"></div>
    <div class="mb-3"><label class="form-label">Total copies</label>
      <input type="number" class="form-control" th:field="*{totalCopies}" th:errorclass="is-invalid">
      <div class="invalid-feedback" th:errors="*{totalCopies}"></div></div>
    <div><button class="btn btn-primary">Save</button> <a class="btn btn-secondary" href="/books">Cancel</a></div>
  </form>
</div>
</body>
</html>
