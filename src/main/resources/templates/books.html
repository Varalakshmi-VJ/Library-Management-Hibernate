<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Books')}"></head>
<body>
<nav th:replace="~{fragments :: nav(${active})}"></nav>
<div class="container">
  <div th:replace="~{fragments :: flash}"></div>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="mb-0">Books</h3>
    <a class="btn btn-primary" href="/books/new">+ Add Book</a>
  </div>
  <form class="input-group mb-3" method="get" action="/books">
    <input class="form-control" name="q" th:value="${q}" placeholder="Search by title, ISBN, category or author">
    <button class="btn btn-outline-primary">Search</button>
    <a class="btn btn-outline-secondary" href="/books">Clear</a>
  </form>
  <table class="table table-bordered table-hover bg-white align-middle">
    <thead class="table-light">
      <tr><th>Title</th><th>Authors</th><th>Category</th><th>ISBN</th><th>Available</th><th style="width:150px">Actions</th></tr>
    </thead>
    <tbody>
      <tr th:each="b : ${books.content}">
        <td th:text="${b.title}"></td>
        <td th:text="${b.authorNames}"></td>
        <td th:text="${b.category}"></td>
        <td th:text="${b.isbn}"></td>
        <td><span class="badge" th:classappend="${b.availableCopies > 0} ? 'text-bg-success' : 'text-bg-danger'"
                  th:text="${b.availableCopies} + ' / ' + ${b.totalCopies}"></span></td>
        <td>
          <a class="btn btn-sm btn-outline-primary" th:href="@{/books/edit/{id}(id=${b.id})}">Edit</a>
          <form class="d-inline" method="post" th:action="@{/books/delete/{id}(id=${b.id})}"
                onsubmit="return confirm('Delete this book?')">
            <button class="btn btn-sm btn-outline-danger">Delete</button>
          </form>
        </td>
      </tr>
      <tr th:if="${books.empty}"><td colspan="6" class="text-center text-muted">No books found</td></tr>
    </tbody>
  </table>
  <nav th:if="${books.totalPages > 1}">
    <ul class="pagination">
      <li class="page-item" th:classappend="${books.first} ? 'disabled'">
        <a class="page-link" th:href="@{/books(q=${q},page=${books.number - 1})}">Previous</a></li>
      <li class="page-item" th:each="i : ${#numbers.sequence(0, books.totalPages - 1)}" th:classappend="${i == books.number} ? 'active'">
        <a class="page-link" th:href="@{/books(q=${q},page=${i})}" th:text="${i + 1}"></a></li>
      <li class="page-item" th:classappend="${books.last} ? 'disabled'">
        <a class="page-link" th:href="@{/books(q=${q},page=${books.number + 1})}">Next</a></li>
    </ul>
  </nav>
</div>
</body>
</html>
