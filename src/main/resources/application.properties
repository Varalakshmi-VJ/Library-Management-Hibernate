server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/library_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:system}

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Loads lazy collections in batches (reduces the N+1 problem)
spring.jpa.properties.hibernate.default_batch_fetch_size=20
# Keeps the Hibernate session open while Thymeleaf renders (lazy loading in views)
spring.jpa.open-in-view=true

spring.thymeleaf.cache=false
