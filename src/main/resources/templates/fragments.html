<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' | Library'">Library</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:fragment="nav(active)" class="navbar navbar-expand navbar-dark bg-primary mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/books">Library Management</a>
    <div class="navbar-nav">
      <a class="nav-link" th:classappend="${active == 'books'} ? 'active'" href="/books">Books</a>
      <a class="nav-link" th:classappend="${active == 'members'} ? 'active'" href="/members">Members</a>
      <a class="nav-link" th:classappend="${active == 'issues'} ? 'active'" href="/issues">Issue / Return</a>
    </div>
  </div>
</nav>
<div th:fragment="flash">
  <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
  <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
</div>
</body>
</html>
