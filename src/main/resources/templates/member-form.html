<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Member')}"></head>
<body>
<nav th:replace="~{fragments :: nav(${active})}"></nav>
<div class="container" style="max-width:560px">
  <h3>Add Member</h3>
  <form method="post" action="/members/save" th:object="${member}" class="card card-body">
    <div class="mb-3"><label class="form-label">Name</label>
      <input class="form-control" th:field="*{name}" th:errorclass="is-invalid">
      <div class="invalid-feedback" th:errors="*{name}"></div></div>
    <div class="mb-3"><label class="form-label">Email</label>
      <input class="form-control" th:field="*{email}" th:errorclass="is-invalid">
      <div class="invalid-feedback" th:errors="*{email}"></div></div>
    <div><button class="btn btn-primary">Save</button> <a class="btn btn-secondary" href="/members">Cancel</a></div>
  </form>
</div>
</body>
</html>
